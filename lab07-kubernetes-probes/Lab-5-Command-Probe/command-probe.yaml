apiVersion: v1
kind: Pod
metadata:
  name: execprobe-pod
spec:
  containers:
    - name: busybox
      image: busybox
      command:
        - sh
        - -c
        - touch /tmp/healthy; sleep 300
      livenessProbe:
        exec:
          command:
            - cat
            - /tmp/healthy
        initialDelaySeconds: 5
        periodSeconds: 5
